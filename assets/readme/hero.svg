<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Flit — 桌面与全屏，一键切换。</title>
  <desc id="desc">浅色鸢尾紫背景，Flit 双窗标志，右侧是 Command 和 Tab 键帽，表示按住选择、松开切换。</desc>
  <defs>
    <path id="pane" d="M0 11 Q0 7 4 6 L17 2 Q21 1 21 5 L21 31 Q21 35 17 36 L4 40 Q0 41 0 37 Z" />
  </defs>
  <rect width="1200" height="300" rx="28" fill="#F3EEF8" />
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <use href="#pane" transform="translate(60 84) scale(2.35)" fill="#7951D2" />
    <use href="#pane" transform="translate(101 60) scale(2.35)" fill="#BEA5F0" />
    <text x="178" y="168" font-size="112" font-weight="650" letter-spacing="-5" fill="#332C3E">Flit</text>
    <text x="60" y="243" font-size="36" font-weight="500" fill="#332C3E">桌面与全屏，一键切换。</text>
    <g fill="#FCFAFF" stroke="#E4DAEF" stroke-width="2">
      <rect x="794" y="71" width="126" height="130" rx="25" />
      <rect x="936" y="71" width="204" height="130" rx="25" />
    </g>
    <text x="857" y="157" text-anchor="middle" font-size="68" fill="#7951D2">⌘</text>
    <text x="1038" y="156" text-anchor="middle" font-size="56" font-weight="500" fill="#7951D2">Tab</text>
    <text x="967" y="245" text-anchor="middle" font-size="24" fill="#71637E">按住选择，松开切换</text>
  </g>
</svg>
